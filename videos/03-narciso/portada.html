<!doctype html>

<script type="module">
import { encuadrar, rasgar } from '../../diseno/sistema.js';
encuadrar(document, { caravaggio: { src: 'assets/caravaggio.jpg', w: 1920, h: 2325 } });

await document.fonts.ready;
