<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba de estilo · Obra en riso</title>
<link rel="stylesheet" href="../../diseno/sistema.css">
<style>
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<div class="frame" id="video"><canvas id="lienzo" width="1080" height="1920"></canvas></div>
<script type="module">
// Prueba D · Una obra "impresa" en riso: Desayuno en la cama (Cassatt) separada en tres tintas (azul, rosa flúor,
// amarillo), en trama, con desregistro y grano que respira; la cámara se acerca a las caras.
import { Riso, TINTAS } from '../../diseno/estilos/riso.js';
import { hervor, azar } from '../../diseno/estilos/ruido.js';

const W = 1080, H = 1920, DURACION = 6;
const lienzo = document.getElementById('lienzo').getContext('2d');
const riso = new Riso(W, H, [
  { id: 'amarillo', color: TINTAS.amarillo, angulo: 5, celda: 9, opacidad: 0.95 },
  { id: 'rosa', color: TINTAS.rosaFluo, angulo: 75, celda: 9, opacidad: 0.9 },
  { id: 'azul', color: TINTAS.azul, angulo: 15, celda: 9, opacidad: 0.95 },
]);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const suave = p => -(Math.cos(Math.PI * p) - 1) / 2;

// separación de la pintura en tres densidades (una vez)
const img = new Image(); img.src = '../05-trapito/assets/cassatt.jpg'; await img.decode();
const iw = img.naturalWidth, ih = img.naturalHeight;
const tmp = Object.assign(document.createElement('canvas'), { width: iw, height: ih }), tc = tmp.getContext('2d');
tc.drawImage(img, 0, 0);
const px = tc.getImageData(0, 0, iw, ih).data;
const sep = {};
for (const id of ['azul', 'rosa', 'amarillo']) { const c = Object.assign(document.createElement('canvas'), { width: iw, height: ih }); sep[id] = { c, img: c.getContext('2d').createImageData(iw, ih) }; }
for (let i = 0; i < iw * ih; i++) {
  const R = px[i * 4] / 255, G = px[i * 4 + 1] / 255, B = px[i * 4 + 2] / 255;
  // azul donde falta rojo (sombras y frío), rosa y amarillo para lo cálido; sin tinta en los blancos
  const az = Math.pow(clamp((1 - R) * 1.2 - 0.16), 1.2), ro = clamp(((1 - G) - 0.55 * (1 - R)) * 1.6 - 0.04), am = clamp(((1 - B) - 0.5 * (1 - R)) * 1.4 - 0.04);
  for (const [id, d] of [['azul', az], ['rosa', ro], ['amarillo', am]]) { const o = sep[id].img.data; o[i * 4 + 3] = d * 255; }
}
for (const id in sep) sep[id].c.getContext('2d').putImageData(sep[id].img, 0, 0);

// encuadres (px del original): de la cama entera a las dos caras
const A = [334, 0, 572, 1017], Bc = [440, 90, 400, 711];
function seek(t) {
  const hv = hervor(t, 10), rnd = azar(hv * 31 + 1);
  const p = suave(clamp(t / DURACION));
  const [sx, sy, sw, sh] = A.map((a, i) => lerp(a, Bc[i], p));
  riso.limpiar();
  for (const id of ['azul', 'rosa', 'amarillo']) {
    const c = riso.ctx(id);
    c.drawImage(sep[id].c, sx, sy, sw, sh, 0, 0, W, H);
    // la ficha, impresa en azul sobre una banda sin tinta
    if (id !== 'azul') { c.save(); c.globalCompositeOperation = 'destination-out'; c.fillRect(70, 1580, 720, 70); c.restore(); }
    else { c.save(); c.globalCompositeOperation = 'destination-out'; c.fillRect(70, 1580, 720, 70); c.restore();
      c.fillStyle = '#000'; c.font = '26px "Space Mono"'; c.fillText('MARY CASSATT · DESAYUNO EN LA CAMA, 1897', 92, 1625); }
  }
  riso.imprimir(lienzo, { papel: '#F4EEE2', hervor: hv,
    desregistro: { azul: [0, 0], rosa: [5 + (rnd() - 0.5) * 2, -3], amarillo: [-4, 4 + (rnd() - 0.5) * 2] } });
}
await document.fonts.load('26px "Space Mono"');
window.seek = seek; window.DURACION = DURACION; seek(0); window.listo = true;
</script>
</body>
</html>
