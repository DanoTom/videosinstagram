<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Portada · El trapito</title>
<link rel="stylesheet" href="../../diseno/sistema.css">
<style>
  :root { --noche: #24324A; --crema: #F1E8D8; --coral: #E07A5F; --tinta: #1D1A17;
    --linea: var(--crema); --trapo: var(--coral); --trapo2: #F6D7C8; --manta: #3B4F78; --manta2: #4A5F8C; }
  body { margin: 0; }
  #portada { background: var(--noche); }
</style>
</head>
<body>
<!-- Todo dentro del recorte 3:4 de la grilla del perfil (y 240–1680) -->
<section class="frame" id="portada">
  <div class="puntos"></div>
  <div class="tira titular" data-rasgado style="top:300px;left:150px;font-size:124px;white-space:nowrap;transform:rotate(-2deg)">¿Tuviste uno?</div>
  <div style="left:-100px;top:380px;width:1280px;height:1000px;background:radial-gradient(closest-side, rgba(224,122,95,.42), rgba(224,122,95,0))"></div>
  <svg id="nene" viewBox="0 0 1000 760" style="left:40px;top:500px;width:1000px;height:760px;overflow:visible"></svg>
  <div class="negro serif" style="top:1290px;left:110px;font-size:62px;line-height:1.1;transform:rotate(-1.5deg)">Lo que explica<br>sobre el arte</div>
  <div class="ficha" style="top:1530px;left:120px;transform:rotate(-1deg)">D. W. Winnicott · el objeto transicional</div>
  <div class="grano"></div>
</section>
<script type="module">
import { rasgar } from '../../diseno/sistema.js';
import { dibujo } from '../../diseno/motor.js';
import { nene } from './dibujos.js';
const s = document.getElementById('nene');
s.innerHTML = nene;
dibujo(s, 1, { rellenos: [-1] });
rasgar(document);
await document.fonts.ready;
window.listo = true;
</script>
</body>
</html>
